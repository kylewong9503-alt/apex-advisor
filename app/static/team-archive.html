<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apex Advisor — 团队成员档案</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface2: #243044;
      --text: #e7edf4;
      --muted: #8b9cb3;
      --border: #2d3a4d;
      --accent: #2e7dc5;
      --accent-dim: #4a6a85;
      --danger: #c94c4c;
      --warn: #d97706;
      --warn-bg: rgba(217, 119, 6, 0.12);
      --danger-bg: rgba(201, 76, 76, 0.12);
      --radius: 10px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .app {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
    }
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .main {
      padding: 1.5rem 2rem;
      overflow: auto;
      max-height: 100vh;
    }
    h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 0.5rem; color: var(--muted); }
    h2 { font-size: 1.35rem; margin: 0 0 1rem; }
    h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 1.5rem 0 0.75rem; }
    .auth-panel {
      background: var(--surface2);
      border-radius: var(--radius);
      padding: 1rem;
      border: 1px solid var(--border);
    }
    .auth-panel h2 { font-size: 1rem; margin-bottom: 0.75rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.25rem; }
    input, textarea, select, button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 0.5rem 0.65rem;
      width: 100%;
    }
    button {
      cursor: pointer;
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
      margin-top: 0.5rem;
    }
    button.secondary {
      background: var(--surface2);
      border-color: var(--border);
      color: var(--text);
    }
    button.danger-outline {
      background: transparent;
      border-color: var(--danger);
      color: var(--danger);
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .member-list { display: flex; flex-direction: column; gap: 0.35rem; }
    .member-item {
      text-align: left;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      margin-top: 0;
    }
    .member-item:hover { border-color: var(--accent); }
    .member-item.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .member-item .role { font-size: 0.8rem; color: var(--muted); }
    .empty-hint { color: var(--muted); font-size: 0.9rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }
    .tag-pill {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      background: var(--surface2);
      font-size: 0.85rem;
      margin: 0.15rem 0.35rem 0.15rem 0;
    }
    .conf-bar-wrap {
      margin: 0.65rem 0;
    }
    .conf-bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 0.35rem;
    }
    .conf-bar-label span.cat { color: var(--muted); font-size: 0.75rem; }
    .conf-bar-track {
      height: 8px;
      border-radius: 4px;
      background: var(--surface2);
      overflow: hidden;
    }
    .conf-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.35s ease;
    }
    .taboo-block {
      border-left: 4px solid var(--danger);
      background: var(--danger-bg);
      padding: 1rem 1rem 1rem 1.25rem;
      border-radius: 0 var(--radius) var(--radius) 0;
      color: #f0c0c0;
    }
    .taboo-block strong { color: var(--danger); display: block; margin-bottom: 0.35rem; }
    .nudge-ai {
      background: var(--warn-bg);
      border: 1px solid rgba(217, 119, 6, 0.35);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .nudge-ai p { margin: 0; font-size: 0.95rem; }
    .ai-panel .dolphin {
      display: inline-block;
      animation: sway 2s ease-in-out infinite;
      font-size: 1.25rem;
      margin-right: 0.35rem;
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }
    .chat-thread {
      max-height: 280px;
      overflow-y: auto;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75rem;
      margin: 0.75rem 0;
    }
    .msg { margin: 0.5rem 0; padding: 0.5rem 0.65rem; border-radius: 8px; font-size: 0.9rem; }
    .msg.user { background: var(--surface2); margin-left: 2rem; }
    .msg.ai { background: rgba(46, 125, 197, 0.15); margin-right: 2rem; border: 1px solid rgba(46, 125, 197, 0.25); }
    .msg .who { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.25rem; }
    .tag-editor-row {
      display: grid;
      grid-template-columns: 1fr 1fr 100px auto;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    @media (max-width: 700px) {
      .tag-editor-row { grid-template-columns: 1fr; }
    }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
    .logout { margin-top: auto; }
    .hidden { display: none !important; }
    .error { color: var(--danger); font-size: 0.85rem; margin-top: 0.35rem; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div>
        <h1>Apex Advisor</h1>
        <p style="margin:0;font-size:0.85rem;color:var(--muted)">Layer 1 · 团队档案</p>
      </div>
      <div id="auth-panel" class="auth-panel">
        <h2>登录</h2>
        <label>邮箱</label>
        <input type="email" id="email" placeholder="you@company.com" autocomplete="username" />
        <label>密码</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        <button type="button" id="btn-login">登录</button>
        <button type="button" class="secondary" id="btn-register">注册账号</button>
        <p id="auth-error" class="error hidden"></p>
      </div>
      <div id="member-section" class="hidden">
        <h2 style="font-size:1rem">成员列表</h2>
        <button type="button" class="secondary" id="btn-new-member" style="margin-top:0">+ 新建成员</button>
        <div id="member-list" class="member-list" style="margin-top:0.75rem"></div>
        <button type="button" class="secondary danger-outline logout" id="btn-logout">退出登录</button>
      </div>
    </aside>
    <main class="main">
      <div id="placeholder" class="empty-hint">
        登录后选择左侧成员查看结构化档案，或使用「AI 建档对话」补充行为标签。
      </div>
      <div id="detail" class="hidden">
        <h2 id="detail-title">—</h2>
        <div id="nudge-empty-tags" class="nudge-ai hidden">
          <p>尚未完成 AI 行为建档。开始对话后，系统会生成可编辑的标签供你确认入库。</p>
          <button type="button" id="btn-scroll-ai">开始 / 更新 AI 建档</button>
        </div>
        <div class="card">
          <h3>基本信息</h3>
          <div class="grid-2" id="basic-fields"></div>
        </div>
        <div class="card">
          <h3>沟通与决策偏好</h3>
          <div id="pref-fields" class="grid-2"></div>
        </div>
        <div class="card">
          <h3>行为特征标签</h3>
          <div id="behavior-tags"></div>
        </div>
        <div class="card">
          <h3>禁忌雷区</h3>
          <div id="taboo-zone"></div>
        </div>
        <div class="card">
          <h3>备注</h3>
          <p id="notes-text" class="empty-hint" style="margin:0">—</p>
        </div>
        <div class="card ai-panel" id="ai-section">
          <h3><span class="dolphin" aria-hidden="true">🐬</span>AI 建档对话</h3>
          <p style="margin:0 0 0.75rem;font-size:0.9rem;color:var(--muted)">
            多轮描述该成员的典型行为；可随时结束对话并生成标签草稿，确认后写入档案。
          </p>
          <div class="toolbar">
            <button type="button" id="btn-ai-start">开始 / 更新建档</button>
            <button type="button" class="secondary" id="btn-ai-finalize" disabled>生成标签草稿</button>
          </div>
          <div id="ai-session-hint" class="empty-hint" style="margin-top:0.5rem"></div>
          <div class="chat-thread" id="chat-thread"></div>
          <textarea id="chat-input" rows="2" placeholder="描述该成员在会议、邮件或协作中的具体表现…"></textarea>
          <button type="button" id="btn-ai-send" disabled>发送</button>
          <div id="draft-section" class="hidden" style="margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--border)">
            <h3 style="margin-top:0">待确认标签</h3>
            <p class="empty-hint" style="margin-top:0">可增删改后保存；覆盖模式将替换现有全部标签。</p>
            <label>更新方式</label>
            <select id="draft-mode">
              <option value="increment">增量合并</option>
              <option value="overwrite">覆盖现有标签</option>
            </select>
            <div id="tag-editor"></div>
            <button type="button" class="secondary" id="btn-add-tag-row">+ 手动添加标签</button>
            <button type="button" id="btn-save-tags">保存到档案</button>
            <p id="draft-error" class="error hidden"></p>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script>
    const API = "/api/v1";
    let token = localStorage.getItem("apex_access_token") || "";
    let members = [];
    let selectedId = null;
    let profilerSessionId = null;
    let draftTags = [];

    function authHeaders() {
      return {
        "Content-Type": "application/json",
        Authorization: "Bearer " + token,
      };
    }

    async function api(path, opts = {}) {
      const r = await fetch(API + path, {
        ...opts,
        headers: { ...authHeaders(), ...(opts.headers || {}) },
      });
      const text = await r.text();
      let data;
      try { data = text ? JSON.parse(text) : null; } catch { data = { detail: text }; }
      if (!r.ok) throw new Error(data.detail || r.statusText || "请求失败");
      return data;
    }

    function confColor(c) {
      const high = [46, 125, 197];
      const low = [74, 106, 133];
      const t = Math.max(0, Math.min(1, (c - 0.4) / 0.4));
      const rgb = high.map((h, i) => Math.round(h * t + low[i] * (1 - t)));
      return "rgb(" + rgb.join(",") + ")";
    }

    function showAuthError(msg) {
      const el = document.getElementById("auth-error");
      el.textContent = msg;
      el.classList.toggle("hidden", !msg);
    }

    function setLoggedIn(logged) {
      document.getElementById("auth-panel").classList.toggle("hidden", logged);
      document.getElementById("member-section").classList.toggle("hidden", !logged);
      if (logged) loadMembers();
      else {
        members = [];
        selectedId = null;
        document.getElementById("detail").classList.add("hidden");
        document.getElementById("placeholder").classList.remove("hidden");
      }
    }

    async function loadMembers() {
      try {
        members = await api("/team/members");
        renderMemberList();
      } catch (e) {
        token = "";
        localStorage.removeItem("apex_access_token");
        setLoggedIn(false);
        showAuthError("会话已失效，请重新登录");
      }
    }

    function renderMemberList() {
      const box = document.getElementById("member-list");
      box.innerHTML = "";
      members.forEach((m) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "member-item" + (selectedId === m.id ? " active" : "");
        b.innerHTML = "<strong>" + escapeHtml(m.name) + "</strong><div class=\"role\">" + escapeHtml(m.role) + "</div>";
        b.onclick = () => selectMember(m.id);
        box.appendChild(b);
      });
    }

    function escapeHtml(s) {
      if (!s) return "";
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    async function selectMember(id) {
      selectedId = id;
      renderMemberList();
      const m = await api("/team/members/" + id);
      document.getElementById("placeholder").classList.add("hidden");
      document.getElementById("detail").classList.remove("hidden");
      document.getElementById("detail-title").textContent = m.name + " · " + m.role;

      const basic = document.getElementById("basic-fields");
      basic.innerHTML =
        field("姓名", m.name) +
        field("角色", m.role) +
        field("性格特征", m.personality_traits || "—");

      const pref = document.getElementById("pref-fields");
      pref.innerHTML =
        field("沟通偏好", m.communication_preference || "—") +
        field("决策风格", m.decision_style || "—") +
        field("汇报偏好", m.reporting_preference || "—");

      const tags = m.behavior_tags || [];
      document.getElementById("nudge-empty-tags").classList.toggle("hidden", tags.length > 0);
      const bt = document.getElementById("behavior-tags");
      if (!tags.length) {
        bt.innerHTML = "<p class=\"empty-hint\">暂无行为标签</p>";
      } else {
        bt.innerHTML = tags.map(renderTagBar).join("");
      }

      const taboo = (m.taboo || "").trim();
      const tz = document.getElementById("taboo-zone");
      if (!taboo) {
        tz.innerHTML = "<p class=\"empty-hint\">未记录禁忌雷区</p>";
      } else {
        tz.innerHTML =
          "<div class=\"taboo-block\"><strong>注意 · 禁忌雷区</strong>" +
          escapeHtml(taboo).replace(/\n/g, "<br/>") +
          "</div>";
      }

      document.getElementById("notes-text").textContent = m.notes || "无";

      resetAiUi();
    }

    function field(label, val) {
      return "<div><label style=\"margin:0 0 0.2rem\">" + escapeHtml(label) + "</label><div>" + escapeHtml(String(val)) + "</div></div>";
    }

    function renderTagBar(t) {
      const pct = Math.round((t.confidence || 0) * 100);
      const col = confColor(t.confidence || 0);
      return (
        "<div class=\"conf-bar-wrap\">" +
        "<div class=\"conf-bar-label\"><span>" +
        escapeHtml(t.label) +
        "</span><span><span class=\"cat\">" +
        escapeHtml(t.category) +
        "</span> · " +
        pct +
        "%</span></div>" +
        "<div class=\"conf-bar-track\"><div class=\"conf-bar-fill\" style=\"width:" +
        pct +
        "%;background:" +
        col +
        "\"></div></div></div>"
      );
    }

    function resetAiUi() {
      profilerSessionId = null;
      draftTags = [];
      document.getElementById("chat-thread").innerHTML = "";
      document.getElementById("chat-input").value = "";
      document.getElementById("btn-ai-send").disabled = true;
      document.getElementById("btn-ai-finalize").disabled = true;
      document.getElementById("ai-session-hint").textContent = "";
      document.getElementById("draft-section").classList.add("hidden");
      document.getElementById("draft-error").classList.add("hidden");
    }

    document.getElementById("btn-login").onclick = async () => {
      showAuthError("");
      try {
        const data = await api("/auth/login", {
          method: "POST",
          body: JSON.stringify({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        token = data.access_token;
        localStorage.setItem("apex_access_token", token);
        setLoggedIn(true);
      } catch (e) {
        showAuthError(e.message || "登录失败");
      }
    };

    document.getElementById("btn-register").onclick = async () => {
      showAuthError("");
      try {
        await api("/auth/register", {
          method: "POST",
          body: JSON.stringify({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        document.getElementById("btn-login").click();
      } catch (e) {
        showAuthError(e.message || "注册失败");
      }
    };

    document.getElementById("btn-logout").onclick = () => {
      token = "";
      localStorage.removeItem("apex_access_token");
      setLoggedIn(false);
    };

    document.getElementById("btn-new-member").onclick = async () => {
      const name = prompt("成员姓名（必填）");
      if (!name || !name.trim()) return;
      const role = prompt("角色（必填）", "同事") || "同事";
      try {
        await api("/team/members", {
          method: "POST",
          body: JSON.stringify({ name: name.trim(), role: role.trim() }),
        });
        await loadMembers();
      } catch (e) {
        alert(e.message);
      }
    };

    document.getElementById("btn-scroll-ai").onclick = () => {
      document.getElementById("ai-section").scrollIntoView({ behavior: "smooth" });
    };

    document.getElementById("btn-ai-start").onclick = async () => {
      if (!selectedId) return;
      resetAiUi();
      try {
        const res = await api("/ai/behavior-profiler/start", {
          method: "POST",
          body: JSON.stringify({ member_id: selectedId }),
        });
        profilerSessionId = res.session_id;
        document.getElementById("btn-ai-send").disabled = false;
        document.getElementById("btn-ai-finalize").disabled = false;
        document.getElementById("ai-session-hint").textContent = "会话已建立。助手：" + res.greeting.replace(/<[^>]+>/g, "");
        appendChat("ai", res.greeting.replace(/\*\*/g, ""));
      } catch (e) {
        alert(e.message);
      }
    };

    function appendChat(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + (role === "user" ? "user" : "ai");
      div.innerHTML = "<div class=\"who\">" + (role === "user" ? "你" : "Behavior Profiler") + "</div>" + escapeHtml(text).replace(/\n/g, "<br/>");
      document.getElementById("chat-thread").appendChild(div);
      div.scrollIntoView({ behavior: "smooth" });
    }

    document.getElementById("btn-ai-send").onclick = async () => {
      const input = document.getElementById("chat-input");
      const msg = input.value.trim();
      if (!msg || !profilerSessionId) return;
      appendChat("user", msg);
      input.value = "";
      try {
        const res = await api("/ai/behavior-profiler/chat", {
          method: "POST",
          body: JSON.stringify({ session_id: profilerSessionId, user_message: msg }),
        });
        appendChat("ai", res.reply);
        if (res.suggested_tags && res.suggested_tags.length) {
          const hint = "（系统建议标签：" + res.suggested_tags.map((t) => t.label).join("、") + "）";
          appendChat("ai", hint);
        }
      } catch (e) {
        appendChat("ai", "错误：" + e.message);
      }
    };

    document.getElementById("btn-ai-finalize").onclick = async () => {
      if (!profilerSessionId) return;
      try {
        const res = await api("/ai/behavior-profiler/finalize", {
          method: "POST",
          body: JSON.stringify({ session_id: profilerSessionId }),
        });
        profilerSessionId = null;
        document.getElementById("btn-ai-send").disabled = true;
        document.getElementById("btn-ai-finalize").disabled = true;
        document.getElementById("ai-session-hint").textContent = "会话已结束。请确认下方标签并保存。";
        draftTags = (res.tags || []).map((t) => ({
          label: t.label,
          category: t.category,
          confidence: t.confidence,
          source: t.source || "ai",
        }));
        document.getElementById("draft-mode").value = res.update_mode === "overwrite" ? "overwrite" : "increment";
        renderTagEditor();
        document.getElementById("draft-section").classList.remove("hidden");
      } catch (e) {
        alert(e.message);
      }
    };

    function renderTagEditor() {
      const box = document.getElementById("tag-editor");
      box.innerHTML = "";
      draftTags.forEach((t, i) => {
        const row = document.createElement("div");
        row.className = "tag-editor-row";
        row.innerHTML =
          "<input data-k=\"label\" data-i=\"" + i + "\" placeholder=\"标签\" value=\"" + escapeAttr(t.label) + "\" />" +
          "<input data-k=\"category\" data-i=\"" + i + "\" placeholder=\"分类\" value=\"" + escapeAttr(t.category) + "\" />" +
          "<input data-k=\"confidence\" data-i=\"" + i + "\" type=\"number\" min=\"0\" max=\"1\" step=\"0.05\" value=\"" + t.confidence + "\" />" +
          "<button type=\"button\" class=\"secondary danger-outline\" data-remove=\"" + i + "\">删除</button>";
        box.appendChild(row);
      });
      box.querySelectorAll("input").forEach((inp) => {
        inp.onchange = () => {
          const i = +inp.dataset.i;
          const k = inp.dataset.k;
          let v = inp.value;
          if (k === "confidence") v = parseFloat(v) || 0;
          draftTags[i][k] = v;
        };
      });
      box.querySelectorAll("[data-remove]").forEach((btn) => {
        btn.onclick = () => {
          draftTags.splice(+btn.dataset.remove, 1);
          renderTagEditor();
        };
      });
    }

    function escapeAttr(s) {
      return String(s).replace(/"/g, "&quot;");
    }

    document.getElementById("btn-add-tag-row").onclick = () => {
      draftTags.push({ label: "", category: "manual", confidence: 0.8, source: "manual" });
      renderTagEditor();
    };

    document.getElementById("btn-save-tags").onclick = async () => {
      const err = document.getElementById("draft-error");
      err.classList.add("hidden");
      const tags = draftTags.filter((t) => t.label && String(t.label).trim());
      if (!tags.length) {
        err.textContent = "至少保留一个有效标签，或取消保存。";
        err.classList.remove("hidden");
        return;
      }
      try {
        await api("/team/members/" + selectedId + "/behavior-tags", {
          method: "POST",
          body: JSON.stringify({
            tags: tags.map((t) => ({
              label: String(t.label).trim(),
              category: String(t.category || "general").trim(),
              confidence: Math.max(0, Math.min(1, parseFloat(t.confidence) || 0)),
              source: t.source === "manual" ? "manual" : "ai",
            })),
            update_mode: document.getElementById("draft-mode").value,
          }),
        });
        document.getElementById("draft-section").classList.add("hidden");
        await selectMember(selectedId);
      } catch (e) {
        err.textContent = e.message;
        err.classList.remove("hidden");
      }
    };

    if (token) setLoggedIn(true);
  </script>
</body>
</html>
