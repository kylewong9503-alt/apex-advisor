<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apex Advisor — 公司情报知识库</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface2: #243044;
      --text: #e7edf4;
      --muted: #8b9cb3;
      --border: #2d3a4d;
      --accent: #2e7dc5;
      --accent2: #4facde;
      --warn: #f5a623;
      --warn-bg: rgba(245, 166, 35, 0.12);
      --radius: 10px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.25rem; }
    .auth-panel {
      background: var(--surface2);
      border-radius: var(--radius);
      padding: 1rem;
      border: 1px solid var(--border);
      margin-bottom: 1rem;
    }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.25rem; }
    input, textarea, select, button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 0.5rem 0.65rem;
      width: 100%;
    }
    button {
      cursor: pointer;
      background: linear-gradient(135deg, #1a4a7a, #2e7dc5);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
      margin-top: 0.5rem;
      width: auto;
    }
    button.secondary {
      background: var(--surface2);
      border-color: var(--border);
      color: var(--text);
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .banner {
      background: linear-gradient(90deg, rgba(79, 172, 222, 0.15), rgba(46, 125, 197, 0.08));
      border: 1px solid rgba(79, 172, 222, 0.35);
      border-radius: var(--radius);
      padding: 0.85rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .banner strong { color: var(--accent2); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.75rem;
    }
    .tabs button {
      margin: 0;
      background: var(--surface2);
      border-color: var(--border);
      color: var(--muted);
      font-weight: 500;
    }
    .tabs button.active {
      border-color: var(--accent);
      color: var(--text);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .insight-item {
      border-bottom: 1px solid var(--border);
      padding: 0.65rem 0;
      font-size: 0.9rem;
    }
    .insight-item:last-child { border-bottom: none; }
    .meta { font-size: 0.75rem; color: var(--muted); margin-top: 0.35rem; }
    .digest-box {
      background: var(--surface2);
      border-radius: 8px;
      padding: 0.75rem;
      margin: 0.5rem 0;
      font-size: 0.85rem;
      white-space: pre-wrap;
    }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media (max-width: 700px) { .row-2 { grid-template-columns: 1fr; } }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🧭 Know Your Company</h1>
    <p class="sub">Apex Advisor · 公司情报知识库（四层维度 · 实时洞察 24h）</p>

    <div class="auth-panel" id="auth-box">
      <label>邮箱</label>
      <input id="email" type="email" placeholder="you@example.com" />
      <label>密码</label>
      <input id="password" type="password" />
      <div class="row-2" style="margin-top:0.5rem">
        <button type="button" id="btn-login">登录</button>
        <button type="button" class="secondary" id="btn-register">注册</button>
      </div>
      <p id="auth-err" style="color:#f66;font-size:0.85rem;margin:0.5rem 0 0"></p>
    </div>

    <div id="app-main" class="hidden">
      <p><button type="button" class="secondary" id="btn-logout">退出</button></p>

      <div id="insights-banner" class="banner hidden"></div>

      <div class="card">
        <h2 style="font-size:1rem;margin:0 0 0.75rem">投喂原始情报</h2>
        <label>内容（至少 50 字方可分类）</label>
        <textarea id="raw-input" rows="6" placeholder="粘贴会议记录、通知摘要、讲话要点等…"></textarea>
        <label style="margin-top:0.5rem">来源类型</label>
        <select id="src-type">
          <option value="meeting">会议记录</option>
          <option value="notice">内部通知</option>
          <option value="speech">领导讲话</option>
          <option value="financial">财报摘要</option>
          <option value="news">新闻资讯</option>
          <option value="other">其他</option>
        </select>
        <div class="row-2">
          <button type="button" id="btn-save-input">保存片段</button>
          <button type="button" class="secondary" id="btn-classify" disabled>AI 分类提炼</button>
        </div>
        <p id="input-hint" class="meta">先保存片段，再点击分类（使用最近一次保存的片段）。</p>
      </div>

      <div id="digest-card" class="card hidden">
        <h2 style="font-size:1rem;margin:0 0 0.75rem">待确认摘要（Intelligence Digest）</h2>
        <div id="digest-body"></div>
        <button type="button" id="btn-confirm-digest">确认并入知识库</button>
      </div>

      <div class="card">
        <h2 style="font-size:1rem;margin:0 0 0.75rem">四维度洞察</h2>
        <div class="tabs" id="dim-tabs"></div>
        <div id="dim-panel"></div>
      </div>

      <div class="card">
        <h2 style="font-size:1rem;margin:0 0 0.75rem">关键干系人</h2>
        <div class="row-2">
          <div>
            <label>姓名</label>
            <input id="sh-name" placeholder="姓名" />
          </div>
          <div>
            <label>部门</label>
            <input id="sh-dept" placeholder="部门" />
          </div>
        </div>
        <label>影响力 / 关系说明</label>
        <textarea id="sh-inf" rows="2"></textarea>
        <button type="button" id="btn-add-sh">添加干系人</button>
        <div id="sh-list" style="margin-top:0.75rem"></div>
      </div>
    </div>
  </div>

  <script>
    const API = "/api/v1";
    let token = localStorage.getItem("apex_access_token") || "";
    let lastInputId = null;
    let pendingDigestId = null;

    const DIMS = [
      { id: "business_performance", label: "经营业绩动态" },
      { id: "strategic_direction", label: "战略方向与重点" },
      { id: "cultural_signals", label: "组织文化信号" },
      { id: "internal_rules", label: "内部规则与潜规则" },
    ];
    let activeDim = "business_performance";

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    async function api(path, opts) {
      const headers = { "Content-Type": "application/json" };
      if (token) headers["Authorization"] = "Bearer " + token;
      const r = await fetch(API + path, { ...opts, headers: { ...headers, ...opts.headers } });
      const text = await r.text();
      let data;
      try {
        data = text ? JSON.parse(text) : {};
      } catch {
        data = { detail: text };
      }
      if (!r.ok) {
        const d = data.detail;
        throw new Error(typeof d === "string" ? d : (Array.isArray(d) ? d.map((x) => x.msg).join("; ") : r.statusText));
      }
      return data;
    }

    function setLoggedIn(on) {
      document.getElementById("auth-box").classList.toggle("hidden", on);
      document.getElementById("app-main").classList.toggle("hidden", !on);
      if (on) loadKb();
    }

    function renderTabs() {
      const el = document.getElementById("dim-tabs");
      el.innerHTML = DIMS.map(
        (d) =>
          "<button type=\"button\" class=\"" +
          (d.id === activeDim ? "active" : "") +
          "\" data-d=\"" +
          d.id +
          "\">" +
          escapeHtml(d.label) +
          "</button>"
      ).join("");
      el.querySelectorAll("button").forEach((b) => {
        b.onclick = () => {
          activeDim = b.dataset.d;
          renderTabs();
          renderDim(kbData);
        };
      });
    }

    let kbData = null;

    function renderDim(data) {
      const panel = document.getElementById("dim-panel");
      if (!data || !data.intelligence_by_dimension) {
        panel.innerHTML = "<p class=\"meta\">加载中…</p>";
        return;
      }
      const items = data.intelligence_by_dimension[activeDim] || [];
      if (!items.length) {
        panel.innerHTML = "<p class=\"meta\">该维度暂无洞察</p>";
        return;
      }
      panel.innerHTML = items
        .map(
          (it) =>
            "<div class=\"insight-item\"><div>" +
            escapeHtml(it.content) +
            "</div><div class=\"meta\">更新：" +
            escapeHtml(it.updated_at || "") +
            " · 来源类型：" +
            escapeHtml(it.source_type) +
            "</div></div>"
        )
        .join("");
    }

    function renderBanner(data) {
      const b = document.getElementById("insights-banner");
      const list = data && data.insights_banner ? data.insights_banner : [];
      if (!list.length) {
        b.classList.add("hidden");
        return;
      }
      b.classList.remove("hidden");
      b.innerHTML =
        "<strong>实时洞察（24h）</strong> · " +
        list.length +
        " 条新入库或高亮条目。请在下文各维度查看详情。";
    }

    function renderDigest(data) {
      const card = document.getElementById("digest-card");
      const d = data && data.pending_digest;
      if (!d) {
        card.classList.add("hidden");
        pendingDigestId = null;
        return;
      }
      pendingDigestId = d.id;
      card.classList.remove("hidden");
      let html = "";
      DIMS.forEach((dim) => {
        const t = (d.dimension_summaries && d.dimension_summaries[dim.id]) || "";
        if (!t) return;
        html +=
          "<div><strong>" +
          escapeHtml(dim.label) +
          "</strong><div class=\"digest-box\">" +
          escapeHtml(t) +
          "</div></div>";
      });
      if (d.conflicts && d.conflicts.length) {
        html +=
          "<p style=\"color:#f5a623;font-size:0.85rem\">冲突提示：" +
          d.conflicts.map((c) => escapeHtml(c.description)).join("；") +
          "</p>";
      }
      document.getElementById("digest-body").innerHTML = html || "<p class=\"meta\">暂无摘要文本</p>";
    }

    function renderStakeholders(data) {
      const list = data && data.stakeholders ? data.stakeholders : [];
      document.getElementById("sh-list").innerHTML = list.length
        ? list
            .map(
              (s) =>
                "<div class=\"insight-item\"><strong>" +
                escapeHtml(s.name) +
                "</strong> · " +
                escapeHtml(s.department || "—") +
                "<div class=\"meta\">" +
                escapeHtml(s.influence_description || "") +
                "</div></div>"
            )
            .join("")
        : "<p class=\"meta\">暂无干系人</p>";
    }

    async function loadKb() {
      try {
        kbData = await api("/company/knowledge-base", { method: "GET" });
        renderTabs();
        renderDim(kbData);
        renderBanner(kbData);
        renderDigest(kbData);
        renderStakeholders(kbData);
      } catch (e) {
        alert(e.message);
      }
    }

    document.getElementById("btn-login").onclick = async () => {
      document.getElementById("auth-err").textContent = "";
      try {
        const data = await api("/auth/login", {
          method: "POST",
          body: JSON.stringify({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        token = data.access_token;
        localStorage.setItem("apex_access_token", token);
        setLoggedIn(true);
      } catch (e) {
        document.getElementById("auth-err").textContent = e.message || "登录失败";
      }
    };

    document.getElementById("btn-register").onclick = async () => {
      document.getElementById("auth-err").textContent = "";
      try {
        await api("/auth/register", {
          method: "POST",
          body: JSON.stringify({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        document.getElementById("btn-login").click();
      } catch (e) {
        document.getElementById("auth-err").textContent = e.message || "注册失败";
      }
    };

    document.getElementById("btn-logout").onclick = () => {
      token = "";
      localStorage.removeItem("apex_access_token");
      setLoggedIn(false);
    };

    document.getElementById("btn-save-input").onclick = async () => {
      const raw = document.getElementById("raw-input").value.trim();
      const source_type = document.getElementById("src-type").value;
      if (!raw) return alert("请输入内容");
      try {
        const rows = await api("/company/intelligence-inputs", {
          method: "POST",
          body: JSON.stringify({ items: [{ raw_text: raw, source_type }] }),
        });
        lastInputId = rows[0].id;
        document.getElementById("btn-classify").disabled = false;
        document.getElementById("input-hint").textContent = "已保存片段，可进行 AI 分类。";
      } catch (e) {
        alert(e.message);
      }
    };

    document.getElementById("btn-classify").onclick = async () => {
      if (!lastInputId) return;
      try {
        await api("/company/intelligence/classify", {
          method: "POST",
          body: JSON.stringify({ input_ids: [lastInputId] }),
        });
        await loadKb();
      } catch (e) {
        alert(e.message);
      }
    };

    document.getElementById("btn-confirm-digest").onclick = async () => {
      if (!pendingDigestId) return;
      try {
        await api("/company/intelligence/digests/" + pendingDigestId + "/confirm", {
          method: "POST",
          body: JSON.stringify({}),
        });
        await loadKb();
      } catch (e) {
        alert(e.message);
      }
    };

    document.getElementById("btn-add-sh").onclick = async () => {
      const name = document.getElementById("sh-name").value.trim();
      if (!name) return alert("请输入姓名");
      try {
        await api("/company/stakeholders", {
          method: "POST",
          body: JSON.stringify({
            name,
            department: document.getElementById("sh-dept").value.trim() || null,
            influence_description: document.getElementById("sh-inf").value.trim() || null,
          }),
        });
        document.getElementById("sh-name").value = "";
        document.getElementById("sh-dept").value = "";
        document.getElementById("sh-inf").value = "";
        await loadKb();
      } catch (e) {
        alert(e.message);
      }
    };

    if (token) setLoggedIn(true);
  </script>
</body>
</html>
