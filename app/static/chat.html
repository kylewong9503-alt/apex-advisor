<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apex Advisor — 统一对话 Chatbox</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface2: #243044;
      --text: #e7edf4;
      --muted: #8b9cb3;
      --border: #2d3a4d;
      --accent: #2e7dc5;
      --accent2: #4facde;
      --radius: 10px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.5; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 1.25rem; }
    h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 1rem; }
    .auth-panel {
      background: var(--surface2);
      border-radius: var(--radius);
      padding: 1rem;
      border: 1px solid var(--border);
      margin-bottom: 1rem;
      max-width: 420px;
    }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.25rem; }
    input, textarea, button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 0.5rem 0.65rem;
      width: 100%;
    }
    button {
      cursor: pointer;
      background: linear-gradient(135deg, #1a4a7a, #2e7dc5);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
      margin-top: 0.5rem;
      width: auto;
    }
    button.secondary { background: var(--surface2); border-color: var(--border); color: var(--text); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .banner {
      background: rgba(79, 172, 222, 0.1);
      border: 1px solid rgba(79, 172, 222, 0.35);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .tags {
      display: flex; flex-wrap: wrap; gap: 0.75rem;
      margin: 0.75rem 0 1rem;
      align-items: center;
    }
    .tags span { font-size: 0.8rem; color: var(--muted); margin-right: 0.25rem; }
    .tags label.chk { display: inline-flex; align-items: center; gap: 0.35rem; cursor: pointer; font-size: 0.9rem; color: var(--text); }
    .tags input { width: auto; }
    .dual {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      min-height: 320px;
    }
    @media (max-width: 880px) { .dual { grid-template-columns: 1fr; } }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      display: flex;
      flex-direction: column;
    }
    .panel h3 { margin: 0 0 0.5rem; font-size: 0.85rem; color: var(--accent2); text-transform: uppercase; letter-spacing: 0.04em; }
    .panel .body { flex: 1; overflow: auto; white-space: pre-wrap; font-size: 0.92rem; max-height: 420px; }
    .thread {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75rem;
      max-height: 240px;
      overflow-y: auto;
      margin-bottom: 1rem;
      font-size: 0.88rem;
    }
    .bubble { margin: 0.5rem 0; padding: 0.6rem 0.75rem; border-radius: 8px; }
    .bubble.user { background: var(--surface2); margin-left: 1.5rem; }
    .bubble.ai { background: rgba(46, 125, 197, 0.12); margin-right: 1.5rem; border: 1px solid rgba(46, 125, 197, 0.2); }
    .bubble .meta { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.25rem; }
    .src { font-size: 0.75rem; color: var(--muted); margin-top: 0.35rem; }
    .row-input { display: flex; gap: 0.5rem; align-items: flex-end; }
    .row-input textarea { flex: 1; min-height: 72px; resize: vertical; }
    .hidden { display: none !important; }
    code { color: var(--accent2); font-size: 0.85rem; }
    .slash-suggest {
      font-size: 0.82rem;
      color: var(--muted);
      margin: 0.35rem 0 0.5rem;
      padding: 0.35rem 0.5rem;
      background: var(--surface2);
      border-radius: 8px;
      border: 1px solid var(--border);
      max-height: 6.5rem;
      overflow-y: auto;
    }
    .slash-suggest button.sug {
      display: block;
      width: 100%;
      text-align: left;
      margin: 0.2rem 0;
      padding: 0.35rem 0.5rem;
      background: transparent;
      border: none;
      color: var(--accent2);
      cursor: pointer;
      font: inherit;
    }
    .slash-suggest button.sug:hover { background: rgba(46, 125, 197, 0.15); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>统一对话 Chatbox</h1>
    <p class="sub">档案上下文 · Context_Tag 多选 · 主回复 + 思维链侧栏 · / 命令</p>

    <div id="authBox" class="auth-panel">
      <h2 style="font-size:1rem;margin-top:0">登录</h2>
      <label>邮箱</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="username" />
      <label>密码</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
      <button type="button" id="btnLogin">登录</button>
      <button type="button" class="secondary" id="btnReg">注册并登录</button>
    </div>

    <div id="app" class="hidden">
      <div id="onboard" class="banner"></div>
      <div class="tags">
        <span>Context_Tag：</span>
        <label class="chk"><input type="checkbox" data-tag="team" checked /> 团队</label>
        <label class="chk"><input type="checkbox" data-tag="company" checked /> 公司</label>
        <label class="chk"><input type="checkbox" data-tag="work" checked /> 工作</label>
        <label class="chk"><input type="checkbox" data-tag="industry" checked /> 行业</label>
      </div>
      <div class="thread" id="thread"></div>
      <div class="dual">
        <div class="panel">
          <h3>主回复</h3>
          <div class="body" id="mainOut">（发送消息后显示助手主回复）</div>
        </div>
        <div class="panel">
          <h3>思维链 / 推理</h3>
          <div class="body" id="cotOut">（侧栏展示 chain_of_thought）</div>
        </div>
      </div>
      <p style="font-size:0.8rem;color:var(--muted);margin:0.75rem 0 0.25rem">输入 <code>/</code> 可触发命令补全（<code>?prefix=</code>）；<code>/help</code> 查看完整说明。</p>
      <datalist id="slashList"></datalist>
      <div id="slashSuggest" class="slash-suggest hidden" aria-live="polite"></div>
      <div class="row-input">
        <textarea id="msg" placeholder="输入消息，或以 / 开头使用命令…" autocomplete="off"></textarea>
        <button type="button" id="btnSend">发送</button>
      </div>
      <button type="button" class="secondary" id="btnLogout" style="margin-top:0.75rem">退出登录</button>
    </div>
  </div>
  <script>
    const API = "/api/v1";
    let token = localStorage.getItem("aa_token");
    let sessionId = null;

    function authHeaders() {
      return { "Authorization": "Bearer " + token, "Content-Type": "application/json" };
    }

    /** Parse FastAPI / app JSON error body for alerts. */
    async function apiErrorText(r, fallback) {
      try {
        const j = await r.clone().json();
        if (j.detail !== undefined) {
          if (typeof j.detail === "string") return j.detail;
          if (Array.isArray(j.detail)) {
            return j.detail.map(e => (e.msg || "") + (e.loc ? " (" + e.loc.join(".") + ")" : "")).filter(Boolean).join("; ") || fallback;
          }
        }
        if (j.error && j.error.message) {
          let m = j.error.message;
          if (r.status >= 500 && /database/i.test(m)) {
            m += "\n\n若为本机首次运行：在项目根目录执行：python -m alembic upgrade head\n然后重启 uvicorn。";
          }
          return m;
        }
      } catch (_) { /* not JSON */ }
      return fallback + "（HTTP " + r.status + "）";
    }

    function selectedTags() {
      const boxes = document.querySelectorAll('.tags input[type="checkbox"]');
      const t = [];
      boxes.forEach(b => { if (b.checked) t.push(b.dataset.tag); });
      return t.length ? t : ["team", "company", "work", "industry"];
    }

    function renderOnboard(pc) {
      const el = document.getElementById("onboard");
      if (!pc) { el.textContent = ""; return; }
      const miss = [];
      if (!pc.team) miss.push("团队");
      if (!pc.company) miss.push("公司");
      if (!pc.work) miss.push("工作");
      if (!pc.industry) miss.push("行业");
      el.textContent = miss.length
        ? "档案提示：「" + miss.join("、") + "」层仍为空，可在各模块补充数据以提升回答质量。"
        : "档案各层均有数据，可放心使用上下文。";
    }

    function appendThread(role, text, cot, sources) {
      const th = document.getElementById("thread");
      const div = document.createElement("div");
      div.className = "bubble " + (role === "user" ? "user" : "ai");
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = role === "user" ? "你" : "助手";
      div.appendChild(meta);
      const pre = document.createElement("div");
      pre.textContent = text;
      div.appendChild(pre);
      if (sources && sources.length) {
        const s = document.createElement("div");
        s.className = "src";
        s.textContent = "来源：" + sources.map(x => x.layer + ": " + x.summary).join(" | ");
        div.appendChild(s);
      }
      th.appendChild(div);
      th.scrollTop = th.scrollHeight;
    }

    let slashTimer = null;
    async function loadSlashList(prefix) {
      const q = prefix != null && prefix !== ""
        ? "?prefix=" + encodeURIComponent(prefix)
        : "";
      const r = await fetch(API + "/chat/commands" + q, { headers: authHeaders() });
      if (!r.ok) return;
      const d = await r.json();
      const dl = document.getElementById("slashList");
      dl.innerHTML = "";
      (d.commands || []).forEach(c => {
        const opt = document.createElement("option");
        opt.value = c.name + " ";
        opt.label = (c.description || "") + (c.canonical ? " → " + c.canonical : "");
        dl.appendChild(opt);
      });
    }
    function scheduleSlashSuggest() {
      clearTimeout(slashTimer);
      slashTimer = setTimeout(async () => {
        const ta = document.getElementById("msg");
        const line = (ta.value || "").split("\n")[0];
        const box = document.getElementById("slashSuggest");
        if (!line.startsWith("/") || line.includes(" ")) {
          box.classList.add("hidden");
          box.innerHTML = "";
          return;
        }
        const r = await fetch(API + "/chat/commands?prefix=" + encodeURIComponent(line), { headers: authHeaders() });
        if (!r.ok) return;
        const d = await r.json();
        const cmds = d.commands || [];
        box.innerHTML = "";
        if (!cmds.length) {
          box.classList.add("hidden");
          return;
        }
        cmds.slice(0, 8).forEach(c => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "sug";
          b.textContent = c.name + " — " + (c.description || "");
          b.onclick = () => {
            ta.value = c.name + " ";
            box.classList.add("hidden");
            ta.focus();
          };
          box.appendChild(b);
        });
        box.classList.remove("hidden");
      }, 120);
    }

    async function ensureSession() {
      if (sessionId) return;
      const r = await fetch(API + "/chat/sessions", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({ title: "Chat" }),
      });
      if (!r.ok) throw new Error("创建会话失败");
      const d = await r.json();
      sessionId = d.id;
      renderOnboard(d.profile_completeness);
    }

    async function send() {
      const ta = document.getElementById("msg");
      const text = (ta.value || "").trim();
      if (!text) return;
      await ensureSession();
      appendThread("user", text, null, null);
      ta.value = "";
      const r = await fetch(API + "/chat/sessions/" + sessionId + "/messages", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({ message: text, context_tags: selectedTags() }),
      });
      if (!r.ok) {
        appendThread("assistant", "请求失败: " + r.status, null, null);
        return;
      }
      const d = await r.json();
      const am = d.assistant_message;
      document.getElementById("mainOut").textContent = am.content;
      document.getElementById("cotOut").textContent = am.chain_of_thought || "（无）";
      appendThread("assistant", am.content, am.chain_of_thought, am.sources_used);
      renderOnboard(d.profile_completeness);
    }

    async function boot() {
      if (!token) return;
      const r = await fetch(API + "/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        }),
      });
      if (r.ok) {
        token = (await r.json()).access_token;
        localStorage.setItem("aa_token", token);
      }
      if (!token) return;
      document.getElementById("authBox").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      await loadSlashList();
      await ensureSession();
    }

    document.getElementById("btnLogin").onclick = async () => {
      const r = await fetch(API + "/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
        }),
      });
      if (!r.ok) { alert("登录失败：\n" + await apiErrorText(r, "请检查邮箱与密码")); return; }
      token = (await r.json()).access_token;
      localStorage.setItem("aa_token", token);
      sessionId = null;
      document.getElementById("authBox").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      await loadSlashList();
      await ensureSession();
    };

    document.getElementById("btnReg").onclick = async () => {
      const r = await fetch(API + "/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
        }),
      });
      if (!r.ok) { alert("注册失败：\n" + await apiErrorText(r, "未知错误")); return; }
      document.getElementById("btnLogin").click();
    };

    document.getElementById("btnSend").onclick = () => send();
    document.getElementById("msg").addEventListener("input", scheduleSlashSuggest);
    document.getElementById("msg").addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });

    document.getElementById("btnLogout").onclick = () => {
      token = null;
      sessionId = null;
      localStorage.removeItem("aa_token");
      document.getElementById("app").classList.add("hidden");
      document.getElementById("authBox").classList.remove("hidden");
    };

    if (token) {
      document.getElementById("authBox").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      loadSlashList().then(() => ensureSession()).catch(() => {});
    }
  </script>
</body>
</html>
