*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--ink);font:15px/26px var(--font-sans);font-feature-settings:'tnum' 1}
.step{display:none;height:100vh;min-height:560px}.step.on{display:flex}
.pane{flex:none;width:calc(38% - 32px);max-width:528px;margin:16px;border-radius:24px;overflow:hidden;background:var(--surface)}.pane.dark{background:var(--kon)}
.step.top{flex-direction:column}.step.top .pane{width:auto;max-width:none;height:214px}
.step.right{flex-direction:row-reverse}
.body{flex:1;min-width:0;padding:56px clamp(24px,6vw,96px);display:flex;flex-direction:column;justify-content:space-between;max-width:880px;margin:0 auto;width:100%}
.hd{display:flex;justify-content:space-between;align-items:center}
.brand{font:600 18px/1 var(--font-sans);letter-spacing:.06em;display:inline-flex;align-items:center;gap:10px}.brand svg{border-radius:9px;box-shadow:0 0 0 1px var(--line)}
.hr{display:flex;align-items:center;gap:var(--space-3)}.say{height:34px;font-size:14px}.dots{display:flex}.dots svg{width:34px;height:34px}
.cue{font:500 11px/16px var(--font-sans);letter-spacing:.16em;color:var(--ink-muted);margin-bottom:16px}
h1{font:600 clamp(26px,3.2vw,44px)/1.4 var(--font-sans);letter-spacing:.02em;margin:0 0 40px}
.opts{display:flex;flex-direction:column}
.opt{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:18px 0;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:20px;line-height:1.5;cursor:pointer;min-height:44px}
.opt:last-child{border-bottom:1px solid var(--line)}
.opt .k{width:26px;height:26px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);font-size:12px;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);flex:none}
.opt small{display:block;font-size:13px;color:var(--ink-muted)}
.opt[role=checkbox] .k{color:transparent}.opt[role=checkbox][aria-checked=true] .k{background:var(--ai);border-color:var(--ai);color:var(--on-ai)}
.opt[role=checkbox][aria-checked=true]{background:none;color:var(--ink);margin:0;padding:18px 0;width:100%;border-color:var(--line);border-radius:0}
.opt[role=checkbox][aria-checked=true] small{color:var(--ink-muted);opacity:1}
.opt[aria-checked=true]:not([role=checkbox]){border-radius:var(--radius-md);background:var(--ai);color:var(--on-ai);margin:0 -16px;padding:18px 16px;width:calc(100% + 32px);border-color:var(--ai)}
.opt[aria-checked=true] .k{border-color:var(--on-ai);color:var(--on-ai)}.opt[aria-checked=true] small{color:var(--on-ai);opacity:.85}
.mk-you,.mk-model,.mk-rec{display:inline-block;margin-right:8px;flex:none}
.mk-you{width:10px;height:10px;border-radius:50%;background:var(--ai)}.mk-model{width:10px;height:10px;border-radius:50%;border:1.5px dashed var(--hanada)}
.mk-rec{width:14px;border-top:2px dotted var(--kin);vertical-align:middle}
[aria-checked=true] .mk-you{background:var(--on-ai)}[aria-checked=true] .mk-model{border-color:var(--on-ai)}
textarea{width:100%;font:inherit;font-size:20px;line-height:1.7;padding:16px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink);resize:none}
.ft{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.ft div{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{height:44px;padding:0 24px;border-radius:var(--radius-sm);font:500 15px var(--font-sans);letter-spacing:.04em;display:inline-flex;align-items:center;cursor:pointer;text-decoration:none;border:1px solid var(--line-strong);background:var(--surface-raised);color:var(--ink)}
.btn.p{background:var(--ai);border-color:var(--ai);color:var(--on-ai)}.btn.o{border-color:var(--ai);color:var(--ai)}
.btn.q{border-color:transparent;background:none;color:var(--ai);text-decoration:underline;text-underline-offset:4px;padding:0 8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.bn{position:fixed;top:0;left:0;right:0;z-index:5;background:var(--kin-soft);color:var(--kin);font-size:12px;line-height:20px;text-align:center;padding:2px 8px}
.srs{border-bottom:1px solid var(--line);max-width:620px}.sr{display:flex;gap:20px;padding:12px 0;border-top:1px solid var(--line);font-size:16px;line-height:1.6}.sr span:first-child{width:56px;flex:none;color:var(--ink-muted)}
.nt{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:6;max-width:min(560px,92vw);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:var(--radius-md);font-size:14px;line-height:22px}
.qt{margin:0 0 20px;padding:0 0 0 16px;border-left:2px solid var(--line-strong);color:var(--ink-muted);font-size:15px;line-height:26px}.rd{list-style:none;margin:0;padding:0}.rd li{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line);font-size:18px;line-height:1.5}.rd li:last-child{border-bottom:1px solid var(--line)}.rd small{display:block;margin-top:2px;font-size:13px;color:var(--ink-muted)}.rd .mk-model{margin-top:9px}

.step.compose{position:relative;flex-direction:column;background:var(--surface);overflow:hidden}.step.compose.on{display:flex}
.hero{position:absolute;left:0;right:0;top:0;height:240px;overflow:hidden;opacity:.34;-webkit-mask-image:linear-gradient(#000 10%,transparent);mask-image:linear-gradient(#000 10%,transparent);pointer-events:none}
.glow{position:absolute;left:0;right:0;bottom:0;height:55%;pointer-events:none;background:radial-gradient(ellipse 85% 70% at 50% 118%,color-mix(in srgb,var(--hanada) 30%,transparent),transparent 70%)}
.cbody{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:860px;margin:0 auto;padding:28px clamp(16px,5vw,48px) 24px}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:16px 0}.stage h1{margin:0;font-size:clamp(26px,4.2vw,42px);line-height:1.3}.stage .cue{margin:0}.bigmark svg{display:block;width:60px;height:60px;border-radius:18px;box-shadow:0 0 0 1px var(--line)}
.dock{display:flex;flex-direction:column;gap:10px}.skip{align-self:flex-end;height:28px}
.composer{display:flex;flex-direction:column;gap:2px;background:var(--surface-raised);border:1px solid var(--line);border-radius:28px;padding:14px 10px 8px 22px;box-shadow:0 12px 40px color-mix(in srgb,var(--ai) 12%,transparent);transition:box-shadow .15s,border-color .15s}
.composer:focus-within{border-color:var(--hanada);box-shadow:0 12px 44px color-mix(in srgb,var(--hanada) 28%,transparent)}
.composer textarea{width:100%;min-width:0;border:0;outline:0;background:none;resize:none;font:inherit;font-size:17px;line-height:26px;padding:9px 0;max-height:168px;color:var(--ink);border-radius:0}
.send{flex:none;width:40px;height:40px;padding:0;border-radius:50%;justify-content:center}.send:disabled{background:var(--mizu);border-color:var(--mizu);color:var(--ink-muted);opacity:1}
.dock{position:relative}.tools{display:flex;align-items:center;gap:2px}
.tb{height:32px;padding:0 10px;border:0;border-radius:var(--radius-sm);background:none;color:var(--ink-muted);font:500 13px var(--font-sans);letter-spacing:.02em;cursor:pointer}.tb:hover,.tb[aria-expanded=true]{color:var(--ink);background:var(--mizu)}
.tokens{display:flex;flex-wrap:wrap;gap:2px 14px;margin:0 0 2px}.tokens:empty{display:none}
.tk{padding:0;border:0;background:none;cursor:pointer;font:500 13px/22px var(--font-sans);color:var(--hanada)}.tk.p{color:var(--ai);font-weight:700}.tk::after{content:' ×';color:var(--ink-muted);font-weight:400}
.menu{position:absolute;left:0;right:0;bottom:calc(100% + 8px);max-height:300px;overflow:auto;background:var(--surface-raised);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 16px 48px color-mix(in srgb,var(--ai) 16%,transparent);z-index:5}.menu[hidden]{display:none}
.mi{display:flex;align-items:center;justify-content:space-between;width:100%;height:42px;padding:0 14px;border:0;border-radius:12px;background:none;color:var(--ink);font:500 15px var(--font-sans);text-align:left;cursor:pointer}
.mi:hover{background:var(--mizu)}.mi[aria-selected=true]{font-weight:700}.mi[aria-selected=true]::after{content:'✓';color:var(--ai)}.mi.new{color:var(--ink-muted)}
.menu .newname,.menu .newscene{display:block;width:calc(100% - 12px);height:40px;margin:4px 6px 6px;padding:0 12px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:15px}.menu input[hidden]{display:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.line{font:600 clamp(24px,3vw,44px)/1.45 var(--font-sans);margin:0 0 28px}
.why{margin:0;font-size:17px;line-height:1.9;color:var(--ink-muted);max-width:560px}
.big{font:600 clamp(56px,7vw,88px)/1 var(--font-sans);color:var(--ai);font-variant-numeric:tabular-nums}
.bign{display:flex;align-items:baseline;gap:16px;margin-bottom:12px;flex-wrap:wrap}.bign span+span{font-size:16px;color:var(--ink-muted);line-height:1.7;max-width:480px}
@media(max-width:720px){.step.on{flex-direction:column}.step.right{flex-direction:column}.pane,.step.top .pane{width:auto;max-width:none;height:130px;margin:12px 12px 0;border-radius:20px}.body{padding:24px 22px}h1{margin-bottom:24px}.opt{font-size:17px}.opt[aria-checked=true]{margin:0 -12px;padding:18px 12px;width:calc(100% + 24px)}}
@media(prefers-reduced-motion:no-preference){.step.on .body{animation:in .2s ease-out}@keyframes in{from{opacity:.6;transform:translateY(4px)}to{opacity:1;transform:none}}}
